services:
  api:
    build: .
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgres://skb:skb@postgres:5432/skb
      ALLOW_TEST_AUTH: "true"
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "dist/server.js"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: skb
      POSTGRES_PASSWORD: skb
      POSTGRES_DB: skb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skb -d skb"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - skb_pg:/var/lib/postgresql/data

volumes:
  skb_pg:
