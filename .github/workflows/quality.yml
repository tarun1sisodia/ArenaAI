# This workflow is now SUPERSEDED by the three focused workflows:
#   ci-customer.yml  — triggers on react/**
#   ci-admin.yml     — triggers on admin/**
#   ci-backend.yml   — triggers on backend/** + render.yaml
#
# This file is kept only to catch changes to shared root-level files
# (root package.json, scripts/, .github/) that affect all three apps.
# Individual app quality gates live in the app-specific workflows above.

name: "Monorepo Root — Shared Scripts & Config Guard"

on:
  push:
    branches:
      - main
      - "arena/**"
      - "design/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"
      - "AGENTS.md"
      - "DESIGN_LOCKS.md"
      - "ANIMATION_RULES.md"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  root-check:
    name: "Root Scripts · Healthcheck Script Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Root Dependencies
        run: npm ci

      - name: Verify healthcheck script is runnable
        run: node --check scripts/healthcheck.mjs

      - name: Publish Summary
        if: always()
        run: |
          echo "## Monorepo Root Check" >> $GITHUB_STEP_SUMMARY
          echo "Root scripts validated. Individual app CI runs in app-specific workflows." >> $GITHUB_STEP_SUMMARY
