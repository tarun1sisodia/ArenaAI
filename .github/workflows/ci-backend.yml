name: "Backend API — Quality & Deploy Guard"

on:
  push:
    branches:
      - main
      - "arena/**"
      - "design/**"
      - "feat/**"
      - "fix/**"
    paths:
      - "backend/**"
      - "render.yaml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "render.yaml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  quality-gate:
    name: "TypeCheck · Unit Tests · Docker Build Check"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Run Unit & Contract Tests (no live DB required)
        run: npm run test:ci
        env:
          NODE_ENV: test
          # Live DB integration tests are excluded via test:ci.
          # Run npm run test:integration locally with a real DATABASE_URL.

      - name: TypeScript Production Build (tsc)
        run: npm run build

      - name: Verify dist/server.js was produced
        run: |
          if [ ! -f dist/server.js ]; then
            echo "::error::backend/dist/server.js missing — build failed"
            exit 1
          fi
          echo "Build output:"
          ls -lh dist/

      - name: Publish Build Summary to GitHub Step Summary
        if: always()
        run: |
          echo "## Backend API Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d dist ]; then
            echo "### dist/ output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            du -sh dist/ && find dist -type f | sort >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ dist/ not found — build likely failed." >> $GITHUB_STEP_SUMMARY
          fi
