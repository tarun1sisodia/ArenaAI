name: "Bot Package Updates — Automated Verification & Guard"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "backend/Dockerfile*"
      - ".github/workflows/**"
      - ".github/dependabot.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-bot-update:
    name: "Verify Dependency/Package Bot PR"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install All Locked Dependencies
        run: npm run install:all

      - name: Run Full Monorepo Verification
        run: npm run verify

      - name: Publish Summary to Step Summary
        if: always()
        run: |
          echo "## Dependency & Package Bot Verification" >> $GITHUB_STEP_SUMMARY
          echo "All monorepo typechecks, backend unit/contract tests, SEO tests, and production builds passed." >> $GITHUB_STEP_SUMMARY
