<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="description" content="SK Baghel Tour & Travels React migration platform." />
    <!-- LocationIQ: browser-direct calls are a degraded fallback only (the
         backend proxy /api/v1/locations/autocomplete is primary), so no
         preconnect — PageSpeed flagged it as unused. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols: full variable font from Google Fonts (2026-10-01).
         Subsetting was attempted but fontTools breaks the rlig ligature rules
         that this font uses for icon names — a broken subset ships no icons.
         Future work: migrate to inline SVGs (see master prompt). -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <title>SK Baghel Tour & Travels</title>
    <!-- Google Tag Manager — deferred until browser idle so it never contends
         with LCP on the critical path (PageSpeed: ~90KB unused GTM JS). -->
    <script>
      (function () {
        function loadGTM() {
          (function (w, d, s, l, i) {
            w[l] = w[l] || [];
            w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
            var f = d.getElementsByTagName(s)[0],
              j = d.createElement(s),
              dl = l != "dataLayer" ? "&l=" + l : "";
            j.async = true;
            j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
            f.parentNode.insertBefore(j, f);
          })(window, document, "script", "dataLayer", "GTM-KFXGSK7H");
        }
        if ("requestIdleCallback" in window) {
          window.requestIdleCallback(loadGTM, { timeout: 5000 });
        } else {
          window.addEventListener("load", function () {
            setTimeout(loadGTM, 2000);
          });
        }
      })();
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-KFXGSK7H"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
        title="Google Tag Manager"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root"></div>
    <noscript id="js-fallback">
      <a class="skip-link" href="#main-content">Skip to content</a>
      <main>
        <h1>SK Baghel Tour & Travels</h1>
        <p>JavaScript is required for this React migration preview. Call us at <a href="tel:+916395867598">+91 63958 67598</a>.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
